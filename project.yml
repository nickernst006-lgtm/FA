# Описание проекта Xcode в текстовом виде (для XcodeGen).
# Облачная сборка превращает этот файл в FinanceApp.xcodeproj —
# вручную создавать проект в Xcode больше не нужно.
name: FinanceApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # В Xcode 26 новые проекты по умолчанию всё выполняют на главном потоке.
    # Мы явно задаём классический режим; код при этом корректен в обоих режимах.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MARKETING_VERSION: "3.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  FinanceApp:
    type: application
    platform: iOS
    sources:
      - path: FinanceApp
    settings:
      base:
        PRODUCT_NAME: FinanceApp
        PRODUCT_BUNDLE_IDENTIFIER: com.example.financeapp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Учёт"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
  FinanceAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinanceAppTests
    dependencies:
      - target: FinanceApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.financeapp.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FinanceApp.app/FinanceApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FinanceAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FinanceAppUITests
    dependencies:
      - target: FinanceApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.financeapp.uitests
        TEST_TARGET_NAME: FinanceApp
schemes:
  FinanceApp:
    build:
      targets:
        FinanceApp: all
        FinanceAppTests: [test]
        FinanceAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: FinanceAppTests
        - name: FinanceAppUITests
    archive:
      config: Release
