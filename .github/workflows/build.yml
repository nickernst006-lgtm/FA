## Установка на iPhone: теперь два пути

### Путь А. Через Mac друга (стало проще)
Создавать проект вручную и перетаскивать файлы больше не нужно:
1. Скачайте из GitHub артефакт `FinanceApp-Xcode-project`, распакуйте его и откройте **FinanceApp.xcodeproj**.
2. Нажмите на синюю иконку проекта → **Signing & Capabilities**:
   - **Team**: ваш Apple ID;
   - **Bundle Identifier**: замените `com.example.financeapp` на уникальный, например `com.вашеимя.financeapp`.
3. Подключите iPhone и нажмите ▶ (Run).

Требования: **Xcode 26** (нужен для iPhone на iOS 26). Xcode 26.0–26.3 работает на macOS Sequoia 15.6 и новее, Xcode 26.4 и новее требует macOS Tahoe 26.2 и новее. **Заранее спросите друга, какая версия macOS у него стоит** («Об этом Mac»).

### Путь Б. Вообще без Mac: Windows + SideStore (стоит попробовать первым)
Mac был нужен только для сборки. Теперь её делает GitHub, а SideStore умеет подписывать готовый `.ipa` вашим бесплатным Apple ID прямо на телефоне:
1. На компьютере с Windows установите **iTunes** (с сайта Apple или из Microsoft Store) и **iloader** (официальный установщик SideStore, iloader.app).
2. На iPhone из App Store установите **LocalDevVPN** (сейчас SideStore использует его вместо WireGuard).
3. Подключите iPhone кабелем и через iloader установите SideStore и файл сопряжения. Точные шаги есть в документации: docs.sidestore.io.
4. Перенесите на iPhone файл `FinanceApp-unsigned.ipa` (например, через «Файлы»). В SideStore откройте **My Apps → «+»** и выберите этот файл.
5. Дальше SideStore сам продлевает подпись каждые 7 дней по Wi-Fi (с включённым LocalDevVPN).

> Сначала проверьте, **есть ли LocalDevVPN в российском App Store**: оттуда удаляют многие VPN-приложения. Если его нет, нужен другой путь, напишите мне.

