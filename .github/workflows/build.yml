## Как проверить приложение без Mac и без установки (GitHub Actions)

GitHub бесплатно даёт облачный Mac с Xcode. При каждой загрузке кода он автоматически:
1. **компилирует** приложение для iPhone. Если в коде есть ошибка, вы увидите её здесь, а не у друга;
2. запускает **юнит-тесты**: шифрование (официальные тестовые векторы RFC), вход, смену пароля, неверный пароль, повреждённые данные, Excel-файл, разбор сумм и дат;
3. запускает приложение **в симуляторе iPhone**: робот создаёт пароль, заполняет форму, выбирает значения в списках, сохраняет операцию и **делает скриншоты всех экранов**;
4. собирает готовый файл **FinanceApp-unsigned.ipa** и **готовый проект Xcode**.

> В облако попадает только **код** приложения. Ваших данных там нет и быть не может: их пока не существует, а в тестах используются выдуманные примеры.

### Шаги (один раз, около 15 минут, с компьютера)

1. Зарегистрируйтесь на **github.com** (бесплатно).
2. Справа вверху нажмите **«+» → New repository**. Введите имя, например `finance-app`, выберите **Private** и нажмите **Create repository**.
3. На странице репозитория нажмите ссылку **«uploading an existing file»**.
4. Распакуйте архив и **перетащите в окно браузера всё содержимое** папки `FinanceApp3`: папки `.github`, `FinanceApp`, `FinanceAppTests`, `FinanceAppUITests` и файлы `project.yml`, `README.md`. Нажмите **Commit changes**.
   - Папка `.github` важна: в ней лежит сценарий сборки. Если её не видно, включите в Проводнике «Показывать скрытые элементы». Если она не загрузилась, нажмите **Add file → Create new file**, в имени напишите `.github/workflows/build.yml` и вставьте содержимое этого файла.
5. Откройте вкладку **Actions**. Сборка запустится сама (жёлтый кружок). Через 15–25 минут появится зелёная галочка ✅ или красный крестик ❌.
6. Нажмите на запуск, прокрутите вниз до раздела **Artifacts** и скачайте:
   - `screenshots`: скриншоты всех экранов приложения;
   - `FinanceApp-ipa`: готовое приложение;
   - `FinanceApp-Xcode-project`: готовый проект для Mac;
   - `logs`: журналы, если что-то пошло не так.

**Если стоит ❌:** откройте красный шаг и скопируйте текст ошибки (строки с `error:`), либо скачайте `logs` и пришлите мне. Я исправлю код, вы загрузите исправленные файлы (Add file → Upload files, с заменой), и проверка повторится автоматически.

**Лимиты:** для приватного репозитория GitHub даёт бесплатную квоту минут в месяц. Минуты на Mac расходуются с множителем, поэтому хватает примерно на 8–10 запусков в месяц. Для публичного репозитория минуты не ограничены: код не содержит ничего личного, но решать вам.

