# Учёт операций 3.1: нативное приложение для iPhone

Полностью автономное приложение на Swift/SwiftUI. Работает без интернета, данные зашифрованы AES-256 и хранятся только на iPhone.

---

## Что нового в версии 3.1

### Исправленные ошибки (нашлись при построчной проверке кода)

| Проблема в 3.0 | Что было бы на телефоне | Исправление |
|---|---|---|
| Сброс зависимых списков через `.onChange` | При **редактировании** операции стирались счёт, категория и подкатегория | Сброс перенесён в сами списки: он срабатывает только при ручном выборе |
| Жест касания на весь экран для автоблокировки | Выпадающие списки и поля даты в форме могли **не открываться** | Касания отслеживаются «прозрачно» на уровне окна, плюс учитывается набор текста |
| Автоблокировка не учитывала ввод текста | Приложение могло **заблокироваться посреди заполнения формы** | Любое нажатие и ввод текста продлевают сессию |
| Xcode 26: по умолчанию весь код выполняется на главном потоке | Проект, скорее всего, **не собрался бы** (шифрование в фоне) | Типы данных явно помечены `nonisolated`, режим задан в настройках проекта |
| Формат даты зависел от настроек iPhone | При 12-часовом формате или другом календаре даты могли сохраняться неверно | Фиксированный формат `en_US_POSIX` + григорианский календарь |
| При переименовании банка в поле подставлялось «Тинькофф (2)» | Счётчик попадал в новое название | Счётчик вынесен отдельно |
| Ошибки сохранения проглатывались молча | Данные могли не сохраниться, а вы бы не узнали | Показывается сообщение об ошибке |
| Excel-файл оставался во временной папке | Расшифрованная копия данных лежала на диске | Файл удаляется сразу после закрытия меню «Поделиться» |
| Сумма в Excel как `50000.0` | Некрасиво | `50000.00`, формат «# ##0,00» |

### Безопасность
- **Данные исключены из резервных копий iCloud и компьютера.** Они существуют только на этом iPhone. Резервная копия — это экспорт в Excel.
- **Двойное шифрование:** AES-256 приложения + защита iOS класса «Complete» (пока телефон заблокирован, файл недоступен даже системе).
- **Заставка в переключателе приложений:** миниатюра не показывает ваши данные.
- **Смена пароля** с полной перешифровкой данных.
- Кнопка «Заблокировать сейчас».
- Данные перенесены во внутреннюю папку приложения (Application Support), её не видно в «Файлах».

### Удобство
- **Поиск в истории** по лицу, комментарию, категории и сумме.
- История **сгруппирована по дням**, вверху итог «доходы/расходы» по найденному.
- **Смахивание строки:** влево — удалить, вправо — изменить или сделать копию.
- **Экспорт только найденного** (с учётом фильтров), а не всей базы.
- **Лицо можно добавить прямо из поиска**, не заходя в Настройки.
- После сохранения дата, банк, счёт и операция **остаются** в форме, удобно вводить серию операций. Очищаются сумма, лицо и комментарий.
- Суммы в виде «1 234,56 ₽», доходы зелёным с «+», расходы красным с «−».
- Статистика: период (месяц / год / всё время), **настоящий график** доходов и расходов по месяцам, разбивка расходов и доходов по категориям, по счетам, по лицам.
- Переименование в справочниках **обновляет и сохранённые операции**, чтобы исправить опечатку везде.
- Защита от дублей в справочниках.
- В Excel закреплена строка заголовков и включён автофильтр.
- Своя иконка приложения.

