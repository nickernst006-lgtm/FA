## Структура проекта

```
FinanceApp/            — код приложения (Swift/SwiftUI)
  Assets.xcassets      — иконка и цвет
FinanceAppTests/       — юнит-тесты
FinanceAppUITests/     — UI-тесты со скриншотами
project.yml            — описание проекта (из него генерируется .xcodeproj)
.github/workflows/     — сценарий облачной сборки
```

В коде нет сетевых запросов: поиск по `URLSession`, `http`, `Network` ничего не найдёт. `DemoData.swift` нужен только для скриншотов в автотестах. Он срабатывает лишь при специальном параметре запуска, который задают автотесты, а в Release-сборке (`.ipa`) его нет вовсе.
